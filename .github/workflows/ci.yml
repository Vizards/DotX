name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm lint && pnpm check
      - name: Test Server public interfaces
        run: pnpm test
      - run: pnpm build
      - name: Validate Worker deployment after the component build
        run: pnpm --filter @dotx/server exec wrangler deploy --dry-run
